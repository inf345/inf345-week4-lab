# Runs the marker's own tests whenever the marker changes - the marker is
# code, so it gets a pipeline too.
name: Marker self-test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  selftest:
    name: mark_m2.py tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 -m unittest discover -s tests -v
